apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-service
  namespace: smartschool
spec:
  selector:
    app: rabbitmq-service
  type: NodePort
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
      nodePort: 30085
      protocol: TCP

    - name: management
      port: 15672
      targetPort: 15672
      nodePort: 30086
      protocol: TCP